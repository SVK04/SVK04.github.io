<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Housing -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#090d16" stroke="url(#vk-border)" stroke-width="2.5" />
  
  <!-- Subtle Grid Accent Inside Housing -->
  <path d="M60 16 V104 M16 60 H104" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Monogram Glyph V + K -->
  <!-- V Left Stem to Vertex -->
  <path d="M28 36 L48 84 L56 84 L70 48" stroke="url(#vk-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- K Vertical Stem & Arms -->
  <path d="M66 36 V84" stroke="url(#vk-grad)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M92 38 L68 62 L94 84" stroke="url(#vk-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent Pulse Dot -->
  <circle cx="94" cy="24" r="4.5" fill="#38bdf8" />
  <circle cx="94" cy="24" r="8" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
</svg>